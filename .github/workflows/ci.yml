name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Instalar dependências
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Compilar os módulos Zig (sim.wasm, gen.wasm)
        run: make wasm

      - name: Esquema JSON em dia com o catálogo
        run: |
          node pipeline/schema.mjs
          git diff --exit-code schema/

      - name: Validar todos os episódios
        run: for d in episodes/*/; do node pipeline/validate.mjs "$(basename "$d")"; done

      - name: Verificador de fluidez (30 fps)
        run: node pipeline/smoothness.mjs ep00_nibble --fps 30 --ratio 6 || echo "::warning::trancos encontrados (veja o log)"

      - name: Regressão visual (referências em tests/golden)
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node pipeline/golden.mjs

      - name: Quadros de conferência
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node pipeline/render.mjs ep01_tecla --stills --samples 1 --scale 0.35
          node pipeline/render.mjs ep90_catalogo --stills --samples 1 --scale 0.35

      - uses: actions/upload-artifact@v4
        with:
          name: quadros
          path: episodes/*/output/stills/*.png
          retention-days: 14
